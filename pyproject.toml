[project]
name = "python-template"
version = "0.1.0"
description = "A minimal uv-managed Python project"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.scripts]
python-template = "python_template:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
